; =============================================================================
;  Vehicle-Control ECU - production firmware, SINGLE ENVIRONMENT.
;
;      pio run              build
;      pio run -t upload    flash over the on-board TI ICDI debugger
;      pio device monitor   console (see monitor_speed note below)
;
;  There is deliberately ONE env here. The development workspace carried 19
;  extra bench-harness environments (motor step tests, INA226 calibration, servo
;  jogs, ...); none of them are part of the shipped firmware and none were
;  copied, so nothing here needs excluding and nothing can drift.
;
;  The FreeRTOS kernel is VENDORED in lib/FreeRTOS-Kernel (MIT, v11.1.0), not
;  pulled from the PlatformIO registry - so this repository builds offline, and
;  builds the same way in a year as it does today.
; =============================================================================

[env:lptm4c123gh6pm]
platform = titiva
board = lptm4c123gh6pm

upload_protocol = ti-icdi
debug_tool = ti-icdi
build_type = debug

; Custom linker script: 256K flash / 32K SRAM, with an explicit .ARM.exidx
; section and a link-time assertion that >= 4K of RAM remains between .bss and
; the stack top - so over-allocating static memory fails the BUILD, not the
; vehicle.
board_build.ldscript = linker/tm4c123.ld

; ⚠️ REQUIRED, NOT OPTIONAL. The titiva platform does not forward build_flags to
; the LINK step, and gcc picks the newlib/libgcc multilib from the flags on that
; command line. Without this script the link fails with
;   "firmware.elf uses VFP register arguments, libc.a(...) does not"
; because it silently selects the soft-float variant. See the file's header.
extra_scripts = tools/pio_hardfloat.py

; Every source file is listed explicitly by the filter below; the Library
; Dependency Finder would only fight that (and would try to build the vendored
; kernel a second time, with an include scope that cannot see FreeRTOSConfig.h).
lib_ldf_mode = off

; Console is UART1 on PB0/PB1 @115200 via an EXTERNAL USB-serial adapter -
; NOT the ICDI virtual COM port (UART0/PA0-PA1 is disabled in uart_cfg.h).
monitor_speed = 115200

build_flags =
  ; --- Cortex-M4F hardware FPU ------------------------------------------
  ; The whole image uses the hard-float ABI; a mixed soft/hard image does not
  ; link, so these must apply to every translation unit. Paired with the CPACR
  ; CP10/CP11 enable at the top of startup/startup_tm4c123.c, which runs before
  ; the first float instruction.
  -mfpu=fpv4-sp-d16
  -mfloat-abi=hard
  ; --- FreeRTOS ---------------------------------------------------------
  ; Gates BOTH the task-based application in src/main.c + src/app.c AND the
  ; exception-vector routing in startup/startup_tm4c123.c (SVCall/PendSV/SysTick
  ; -> the kernel handlers). The two must move together.
  -DUSE_FREERTOS
  ; --- toolchain --------------------------------------------------------
  -O0
  -g3
  -ggdb3
  -ffreestanding
  -fno-builtin
  -fdata-sections
  -ffunction-sections
  -Wall
  -Wextra
  ; --- include paths ----------------------------------------------------
  -I include
  -I can_ws/dbc
  -I lib/FreeRTOS-Kernel/include
  -I lib/FreeRTOS-Kernel/portable/GCC/ARM_CM4F

; src/*.c is the whole application; the rest is pulled in by relative path.
; Only the four kernel translation units the firmware actually uses are built -
; NOT heap_*.c, because the build is statically allocated
; (configSUPPORT_DYNAMIC_ALLOCATION = 0) and there is no heap at all.
build_src_filter =
  +<*>
  +<../startup/*.c>
  +<../can_ws/dbc/robot.c>
  +<../lib/FreeRTOS-Kernel/tasks.c>
  +<../lib/FreeRTOS-Kernel/queue.c>
  +<../lib/FreeRTOS-Kernel/list.c>
  +<../lib/FreeRTOS-Kernel/timers.c>
  +<../lib/FreeRTOS-Kernel/portable/GCC/ARM_CM4F/port.c>
